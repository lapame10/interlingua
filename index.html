<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interlingua · aprende volando</title>
<meta name="description" content="Curso de interlingua: lecciones cortas, explicaciones y repaso espaciado.">
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<div id="app">

  <!-- ===== RUTA ===== -->
  <section id="ruta" class="pantalla activa">
    <header class="barra">
      <div class="barraIzq">
        <div class="logo" aria-hidden="true">🌍</div>
        <div>
          <div class="t1">Interlingua</div>
          <div class="t2" id="subRuta">Unidad 1 · Salutationes</div>
        </div>
      </div>
      <div class="stats">
        <div class="stat" title="Días seguidos"><span aria-hidden="true">🔥</span><b id="racha">0</b></div>
        <div class="stat" title="Puntos de práctica"><span aria-hidden="true">⚡</span><b id="xp">0</b></div>
      </div>
    </header>

    <div id="mapa"></div>

    <div class="pie">
      <button class="btnsec" id="reiniciar">Reiniciar progreso</button>
    </div>
  </section>

  <!-- ===== LECCION ===== -->
  <section id="leccion" class="pantalla">
    <header class="barra lecbarra">
      <button class="cerrar" id="salir" aria-label="Salir de la lección">✕</button>
      <div class="progreso" role="progressbar" aria-label="Progreso de la lección"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progBar">
        <div class="progresoIn" id="progIn"></div>
      </div>
      <div class="contador" id="contador" aria-live="polite"></div>
    </header>
    <div id="ejercicio"></div>
    <footer class="acciones">
      <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
      <button class="btn" id="accion" disabled>Comprobar</button>
    </footer>
  </section>

  <!-- ===== FIN ===== -->
  <section id="fin" class="pantalla">
    <div class="finbox">
      <div class="finico" id="finIco" aria-hidden="true">🏆</div>
      <h2 id="finTit">¡Lección completada!</h2>
      <p id="finSub">Buen trabajo.</p>
      <div class="finStats">
        <div><b id="finPrec">100%</b><span>aciertos</span></div>
        <div><b id="finRepaso">0</b><span>a repasar</span></div>
        <div><b id="finRacha">1</b><span>días seguidos</span></div>
      </div>
      <button class="btn" id="continuar">Continuar</button>
    </div>
  </section>

</div>

<script src="curso1.js"></script>
<script src="curso2.js"></script>
<script src="app.js"></script>
<script src="leccion.js"></script>
</body>
</html>
